[package]
name = "picobrew"
version = "0.1.0"
edition = "2021"
rust-version = "1.89"
description = "A pico-fast, Rust-powered package manager for Homebrew formulae"
license = "MIT"
readme = "README.md"
keywords = ["homebrew", "package-manager", "bottles", "cli"]
categories = ["command-line-utilities"]

[dependencies]
anyhow = "1"
clap = { version = "4.5", features = ["derive", "env"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = { version = "2.12", features = ["gzip"] }
flate2 = "1"
tar = "0.4"
sha2 = "0.10"

[dev-dependencies]
tar = "0.4"
flate2 = "1"
serde_json = "1"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"
